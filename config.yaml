project:

  name: Sentinel Grid Intelligence

  version: 1.0


sources:

  conflict:
    enabled: true

  europe_security:
    enabled: true
    config_file: config/europe_security.yaml
    state_file: data/cache/europe_security_state.json

  eonet:
    enabled: true
    collect_natural_events: true
    collect_volcanoes: true
    endpoint_url: "https://eonet.gsfc.nasa.gov/api/v3/events"
    connection_timeout_seconds: 5
    request_timeout_seconds: 15
    max_response_bytes: 5000000

  earthquake:
    usgs:
      enabled: true
      feed_url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson"
      connection_timeout_seconds: 5
      request_timeout_seconds: 15
      max_response_bytes: 5000000

  weather:
    nws:
      enabled: true
      alerts_url: "https://api.weather.gov/alerts/active"
      connection_timeout_seconds: 5
      request_timeout_seconds: 20
      max_response_bytes: 15000000

  humanitarian:
    gdacs:
      enabled: true

  x:
    enabled: true
    connection_timeout_seconds: 5
    request_timeout_seconds: 10
    request_interval_seconds: 2
    max_response_bytes: 1000000
    max_urls_per_run: 25
    cache_file: data/cache/x_public_posts.json
    # Only explicitly listed public status URLs are fetched. Location and
    # classification are operator-supplied; no private user data is inferred.
    urls: []


output:

  directory: data/output

  max_map_events: 2000

  max_file_size_mb: 25

  stale_after_minutes: 390


retention:

  max_age_hours: 72

  max_events: 5000


confidence:

  verified: 90

  high: 70

  medium: 40
