project:

  name: Sentinel Grid Intelligence

  version: 1.0


sources:

  news:
    enabled: true

  conflict:
    enabled: true


  aircraft:

    opensky:
      enabled: true


  maritime:

    aisstream:
      enabled: false


  satellite:
    nasa_eonet:
      enabled: true


  cyber:
    enabled: true

  humanitarian:
    gdacs:
      enabled: true

  x:
    enabled: true
    connection_timeout_seconds: 5
    request_timeout_seconds: 10
    request_interval_seconds: 2
    max_response_bytes: 1000000
    max_urls_per_run: 25
    cache_file: data/cache/x_public_posts.json
    # Only explicitly listed public status URLs are fetched. Location and
    # classification are operator-supplied; no private user data is inferred.
    urls: []


output:

  directory: data/output

  max_map_events: 2000

  max_file_size_mb: 25

  stale_after_minutes: 390


retention:

  max_age_hours: 48

  max_events: 5000


confidence:

  verified: 90

  high: 70

  medium: 40
