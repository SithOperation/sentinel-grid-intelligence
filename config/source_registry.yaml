    url: https://x.com/sentdefender
    trust_tier: osint
    owner: Status-6
  - <<: *x_source
    id: vahid
    name: Vahid
    url: https://x.com/Vahid
    trust_tier: osint
    owner: Vahid
  - <<: *x_source
    id: kyiv_independent
    name: The Kyiv Independent
    url: https://x.com/KyivIndependent
    trust_tier: publisher
