version: "1.0"
sources:
  - &x_source
    id: worldsource24
    name: World Source 24
    adapter: x
    url: https://x.com/Worldsource24
    enabled: true
    categories: [conflict]
    trust_tier: aggregator
    default_feed_eligible: true
    allow_embedding: true
    maximum_items: 20
    discovery_interval_minutes: 30
    retention_hours: 72
    expected_language: en
    geographic_scope: global
    owner: World Source 24
  - <<: *x_source
    id: faytuks_network
    name: Faytuks Network
    url: https://x.com/FaytuksNetwork
    owner: Faytuks Network
  - <<: *x_source
    id: preston_stewart
    name: Preston Stewart
    url: https://x.com/prestonstew_
    trust_tier: osint
    owner: Preston Stewart
  - <<: *x_source
    id: osint613
    name: OSINT 613
    url: https://x.com/Osint613
    trust_tier: osint
    owner: OSINT 613
  - <<: *x_source
    id: sentdefender
